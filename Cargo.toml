[package]
name = "mindwiki"
version = "0.1.0"
edition = "2026"

[dependencies]
dirs = "7.0.0"
eframe = "0.37"
egui = "0.37"
egui_commonmark = "0.26.0"
hex = "0.4.3"
notify = "8.2.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = "1.2.1"
ureq = { version = "3.5.1", features = ["json"] }

[dev-dependencies]
mindwiki-server = { path = "server" }
tempfile = "3.27.0"
tokio = { version = "1", features = ["rt-multi-thread"] }

[workspace]
members = ["server"]
